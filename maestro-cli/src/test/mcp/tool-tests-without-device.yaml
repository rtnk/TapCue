# yaml-language-server: $schema=https://raw.githubusercontent.com/steviec/mcp-server-tester/refs/heads/main/src/schemas/tests-schema.json
tools:
  expected_tool_list:
    - list_devices
    - take_screenshot
    - run
    - inspect_screen
    - cheat_sheet

  tests:
    - name: "List available devices"
      tool: "list_devices"
      params: {}
      expect:
        success: true
        result:
          contains: "device"

    - name: "Get Maestro cheat sheet (bundled with the CLI)"
      tool: "cheat_sheet"
      params: {}
      expect:
        success: true
        result:
          contains: "Maestro Local flow cheat sheet"
