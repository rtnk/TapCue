# yaml-language-server: $schema=https://raw.githubusercontent.com/steviec/mcp-server-tester/refs/heads/main/src/schemas/tests-schema.json
tools:
  expected_tool_list:
    - list_devices
    - take_screenshot
    - run
    - inspect_screen
    - cheat_sheet
    - open_maestro_viewer

  tests:
    - name: "List available devices"
      tool: "list_devices"
      params: {}
      expect:
        success: true
        result:
          contains: "device"

    - name: "Open Maestro Viewer (expect not running with --no-viewer)"
      tool: "open_maestro_viewer"
      params: {}
      expect:
        success: false
        error:
          contains: "Maestro Viewer is not running"

    - name: "Get Maestro cheat sheet (expect API key required)"
      tool: "cheat_sheet"
      params: {}
      expect:
        success: false
        error:
          contains: "MAESTRO_CLOUD_API_KEY"
