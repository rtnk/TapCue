# Baseline CI for the fork (STEP-00). Replaced by ci.yml in STEP-06.
#
# Runs the unit test suite. Since STEP-00B the build has no tasks that fetch
# or package simulator-server (docs/LICENSE-AUDIT.md L-01) or build the
# Viewer frontend that drives it; the guard step below checks the outputs.
# Since STEP-05 it also builds the macOS arm64 archive and checks it with
# scripts/verify-dist.sh, and the macos-dist job runs that archive on an
# Apple silicon runner (D-9): offline, and with the iOS Simulator driver
# built from source (D-5).
name: CI baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit tests (JDK 17, no simulator-server)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - name: Detekt (flow path resolution guard)
        run: ./gradlew :maestro-orchestra:detektMain :maestro-client:detektMain

      - name: Unit tests
        run: ./gradlew test --continue

      - name: Build distribution archive
        run: ./gradlew :maestro-cli:macosArm64DistZip

      - name: Verify distribution archive
        run: scripts/verify-dist.sh --smoke maestro-cli/build/distributions/tapcue-*-macos-arm64.zip

      - name: Negative tests for verify-dist.sh
        run: scripts/fork/test-verify-dist.sh maestro-cli/build/distributions/tapcue-*-macos-arm64.zip

      - name: Upload distribution archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tapcue-macos-arm64
          path: |
            maestro-cli/build/distributions/tapcue-*-macos-arm64.zip
            maestro-cli/build/distributions/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

      - name: Guard - no simulator-server or Viewer in build outputs
        if: always()
        run: scripts/fork/check-no-simulator-server.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/test
            **/build/test-results/test
          retention-days: 7
          if-no-files-found: warn

  macos-dist:
    name: macOS arm64 archive (offline run, iOS driver from source)
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Apple silicon
        run: test "$(uname -m)" = arm64

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - name: Build and verify the archive
        run: |
          ./gradlew :maestro-cli:macosArm64DistZip
          scripts/verify-dist.sh --smoke maestro-cli/build/distributions/tapcue-*-macos-arm64.zip
          (cd maestro-cli/build/distributions && shasum -a 256 -c SHA256SUMS)

      - name: Install the archive
        run: |
          mkdir -p "$RUNNER_TEMP/tapcue"
          unzip -q maestro-cli/build/distributions/tapcue-*-macos-arm64.zip -d "$RUNNER_TEMP/tapcue"
          echo "TAPCUE=$(ls -d "$RUNNER_TEMP"/tapcue/tapcue-*/bin/tapcue)" >> "$GITHUB_ENV"

      - name: Run without network access
        # The JVM takes user.home from the account, not from $HOME, so TapCue state lands in the runner's real home.
        # sandbox-exec denies every outbound connection except loopback (and the DNS resolver socket), so a command
        # that needed the internet would fail here.
        run: |
          cat > "$RUNNER_TEMP/offline.sb" <<'SB'
          (version 1)
          (allow default)
          (deny network-outbound)
          (allow network-outbound (remote ip "localhost:*"))
          (allow network-outbound (remote unix-socket))
          (deny network-outbound (remote unix-socket (path-literal "/private/var/run/mDNSResponder")))
          SB
          offline() { sandbox-exec -f "$RUNNER_TEMP/offline.sb" "$@"; }
          offline curl -sS --max-time 10 https://example.com >/dev/null 2>&1 && { echo "sandbox does not block the network"; exit 1; }
          mkdir -p "$RUNNER_TEMP/project/.tapcue"
          printf 'appId: com.example\n---\n- launchApp\n' > "$RUNNER_TEMP/project/.tapcue/flow.yaml"
          offline "$TAPCUE" --version
          offline "$TAPCUE" --help > /dev/null
          offline "$TAPCUE" check-syntax "$RUNNER_TEMP/project/.tapcue/flow.yaml"
          # Keep STDIN open briefly: the server exits on EOF, possibly before it has answered.
          reply="$({ printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'; sleep 5; } \
            | offline "$TAPCUE" mcp)"
          echo "$reply"
          grep -q '"name":"tapcue"' <<<"$reply"
          test ! -e "$HOME/.maestro"

      - name: Build the iOS Simulator driver from source without fetching anything
        # Not under sandbox-exec: SwiftPM and the Swift macro plugin server sandbox themselves, and sandboxes cannot nest.
        # Instead the build must not resolve any remote package: no SourcePackages checkouts, no fetch in the log.
        run: |
          xcodebuild -version
          "$TAPCUE" driver-setup --simulator
          build="$HOME/.tapcue/maestro-iphonesimulator-driver-build"
          products="$build/driver-iPhoneSimulator/Build/Products"
          ls "$products"/*.xctestrun
          test -d "$products/Debug-iphonesimulator/maestro-driver-iosUITests-Runner.app"
          cat "$build/version.properties"
          test ! -d "$build/driver-iPhoneSimulator/SourcePackages/checkouts"
          ! grep -nE "Fetching|Cloning|Updating https?://|github\.com" "$build/output.log"

      - name: Drive a simulator with the driver built from source
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in devices if "iOS" in r), key=lambda r: [int(x) for x in r.rsplit("iOS-", 1)[1].split("-")], reverse=True)
          print(next(d["udid"] for r in ios for d in devices[r] if d["name"].startswith("iPhone")))')"
          echo "simulator: $udid"
          xcrun simctl bootstatus "$udid" -b
          "$TAPCUE" --device "$udid" hierarchy > "$RUNNER_TEMP/hierarchy.json"
          grep -q '"attributes"' "$RUNNER_TEMP/hierarchy.json"
          echo "hierarchy: $(wc -c < "$RUNNER_TEMP/hierarchy.json") bytes"

      - name: Show iOS driver build log
        if: failure()
        run: |
          log="$HOME/.tapcue/maestro-iphonesimulator-driver-build/output.log"
          grep -nE "error:|warning: .*(sandbox|network)|\*\* .* FAILED \*\*|The following build commands failed" -A3 "$log" | head -n 120 || true
          tail -n 40 "$log" || true
