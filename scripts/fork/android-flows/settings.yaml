# AT-03/AT-05 on a system app every Android image has: launch, assert, scroll, tap, text input, screenshot.
appId: com.android.settings
name: Settings - launch, scroll, tap, input text, screenshot
---
- launchApp:
    clearState: true
# The first launch after a cold boot of the CI emulator (2 CPUs) can take longer than assertVisible waits by default.
- extendedWaitUntil:
    visible: "Network & internet"
    timeout: 60000
# Generous limits: the CI emulator is slow, and "System" is near the end of a long list on a small screen.
- scrollUntilVisible:
    element:
      text: "System"
    timeout: 60000
    visibilityPercentage: 50
- tapOn: "System"
- assertVisible: "Languages.*"
- back
- scroll
- scrollUntilVisible:
    element:
      text: "Network & internet"
    direction: UP
    timeout: 60000
    visibilityPercentage: 50
- tapOn: "Search settings"
- inputText: "battery"
- assertVisible:
    text: "Battery.*"
- takeScreenshot: settings-search
